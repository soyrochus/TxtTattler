[package]
name = "txttattler"
version = "0.1.0"
edition = "2024"
description = "A cheeky Rust CLI that tattles your text out loud with OpenAI TTS."
license = "MIT"
repository = "https://github.com/soyrochus/txttattler"
keywords = ["tts", "cli", "openai", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.100"
async-openai = { version = "0.40.2", features = ["audio"] }
async-trait = "0.1.89"
clap = { version = "4.5.51", features = ["color", "derive"] }
console = "0.16.1"
directories = "6.0.0"
dotenvy = "0.15.7"
encoding_rs = "0.8.35"
indicatif = "0.18.2"
once_cell = "1.21.3"
rodio = "0.22.2"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.8.23"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

[[bin]]
name = "txttattler"
path = "src/main.rs"
