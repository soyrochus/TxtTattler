name: Release binaries

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*"

permissions:
  contents: write

env:
  BIN_NAME: txttattler
  CRATE_DIR: txttattler
  CARGO_TERM_COLOR: always

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check tag format
        id: check
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          else
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping release: tag '${GITHUB_REF_NAME}' does not match v{num.num}."
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: validate-tag
    if: needs.validate-tag.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            exe: ""
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x86_64
            exe: ""
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            exe: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CRATE_DIR }} -> target

      - name: Run tests
        run: cargo test --manifest-path "${{ env.CRATE_DIR }}/Cargo.toml" --locked

      - name: Build release binary
        run: cargo build --manifest-path "${{ env.CRATE_DIR }}/Cargo.toml" --release --locked --target "${{ matrix.target }}"

      - name: Package binary
        id: package
        shell: bash
        run: |
          asset_base="${BIN_NAME}-${GITHUB_REF_NAME}-${{ matrix.suffix }}"
          package_dir="dist/${asset_base}"
          binary_path="${CRATE_DIR}/target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.exe }}"

          mkdir -p "${package_dir}"
          cp "${binary_path}" "${package_dir}/"
          cp "${CRATE_DIR}/README.md" "${package_dir}/"
          cp "LICENSE" "${package_dir}/"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "dist/${asset_base}.zip" "./${package_dir}"
            echo "asset=dist/${asset_base}.zip" >> "${GITHUB_OUTPUT}"
          else
            tar -czf "dist/${asset_base}.tar.gz" -C dist "${asset_base}"
            echo "asset=dist/${asset_base}.tar.gz" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - validate-tag
      - build
    if: needs.validate-tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TxtTattler ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
