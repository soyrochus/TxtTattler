[package]
name = "txttattler"
version = "0.1.0"
edition = "2024"
authors = ["TxtTattler Contributors"]
license = "MIT"
description = "A lightweight Rust CLI that reads text files aloud through OpenAI TTS."
repository = "https://example.invalid/txttattler"
keywords = ["tts", "openai", "cli", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "txttattler"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-openai = { version = "0.40", features = ["audio"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive", "wrap_help"] }
console = "0.16"
directories = "6"
dotenvy = "0.15"
encoding_rs = "0.8"
indicatif = "0.18"
rodio = { version = "0.21", default-features = true }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
