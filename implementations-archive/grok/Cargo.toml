[package]
name = "txttattler"
version = "0.1.0"
edition = "2021"
authors = ["TxtTattler Contributors"]
description = "A gossipy little CLI that tattles your text files out loud using OpenAI TTS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/txttattler"
readme = "README.md"
keywords = ["tts", "text-to-speech", "cli", "openai", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "txttattler"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# OpenAI (supports Azure too)
async-openai = "0.26"

# Audio playback (cross-platform, MP3 support via symphonia backend)
rodio = { version = "0.19", features = ["symphonia-all"] }

# Config & serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"

# .env file support (load OPENAI_API_KEY etc from .env in CWD)
dotenvy = "0.15"

# Content hashing for MP3 cache keys (content + voice + model + speed + processing version)
sha2 = "0.10"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Progress & pretty output
indicatif = "0.17"
console = "0.15"

# Registry & utils
once_cell = "1.20"
tempfile = "3.13"
encoding_rs = "0.8"
async-trait = "0.1"  # Required for async fn in traits used as dyn Trait

# Optional future crates (commented for MVP)
# docx = "0.1"   # placeholder
# lopdf = "0.32" # placeholder for PDF

[dev-dependencies]
tempfile = "3.13"
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"  # Small binary, still fast enough for CLI

# Fun fact: TxtTattler tattles at the speed of sound (well, at your --speed setting)
